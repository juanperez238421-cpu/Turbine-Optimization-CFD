name: ASTRA PIV code QA

on:
  push:
    branches: [astra-piv-tournament-v1]
  pull_request:
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: piv_tournament
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e .
      - name: Install independent video decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Compile source
        run: python -m compileall -q src scripts
      - name: Run CI-safe software tests
        run: python -m unittest discover -s tests -p '*core.py' -v
      - name: Verify real-data test module skips without private data
        env:
          ASTRA_REAL_PIVLAB_DIR: /tmp/astra-no-private-data
        run: python -m unittest discover -s tests -p '*real.py' -v
      - name: Private-data boundary
        run: |
          echo "Canonical experimental data are intentionally not embedded in CI."
          echo "Scientific real-data regression is executed locally/Colab against authenticated project data."
          echo "Run notebooks/ASTRA_PIV_SUPERSTUDY_Q1.ipynb for canonical-data analysis."
