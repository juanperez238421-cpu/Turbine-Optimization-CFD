[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-piv-tournament"
version = "0.2.0"
description = "Evidence-gated multi-selector PIV temporal subsampling and spatial-validation superstudy for GVT measurements"
readme = "README_SUPERSTUDY.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "opencv-python-headless>=4.10",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "ruptures>=1.1.9",
]

[project.scripts]
astra-piv = "astra_piv.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
